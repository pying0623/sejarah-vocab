<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kosa Kata Sejarah 每日生字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EEEA; --board:#1E3A32; --board-ink:#F1F5F0; --board-muted:#A9BDB4;
  --card:#FFFFFF; --ink:#1A1F1D; --muted:#5B6863; --line:#D3DCD6;
  --red:#C23B3B; --rule:#C9D8EA; --ok:#2E7D4F; --ok-bg:#E3F2E8; --bad-bg:#F8E4E2;
  --btn:#1E3A32; --btn-ink:#FFFFFF; --soft:#F2F5F3;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --board:#17302A; --board-ink:#E6EEE8; --board-muted:#8FA59B;
    --card:#1B2320; --ink:#E7EDE9; --muted:#9AA8A2; --line:#2C3833;
    --red:#E3706A; --rule:#2B3B4E; --ok:#5DC087; --ok-bg:#183326; --bad-bg:#3A1F1E;
    --btn:#5DC087; --btn-ink:#0F1613; --soft:#222C28;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --board:#17302A; --board-ink:#E6EEE8; --board-muted:#8FA59B;
  --card:#1B2320; --ink:#E7EDE9; --muted:#9AA8A2; --line:#2C3833;
  --red:#E3706A; --rule:#2B3B4E; --ok:#5DC087; --ok-bg:#183326; --bad-bg:#3A1F1E;
  --btn:#5DC087; --btn-ink:#0F1613; --soft:#222C28;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.term,.serif{font-family:"Fraunces",Georgia,"Times New Roman",serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

header.board{background:var(--board);color:var(--board-ink);padding:22px 18px 0}
.wrap{max-width:640px;margin:0 auto}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:1.7rem;line-height:1.1;margin:0;letter-spacing:-.01em}
.brand p{margin:0;color:var(--board-muted);font-size:.9rem}
nav.tabs{display:flex;gap:2px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{color:var(--board-muted);text-decoration:none;padding:10px 11px;white-space:nowrap;border-radius:10px 10px 0 0;font-weight:600;font-size:.95rem}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink)}
main{padding:18px 16px 48px}

.strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.who{font-weight:700;margin-right:auto}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.85rem;color:var(--muted)}
.chip b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;font-size:.88rem}

.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.progress span{display:block;height:100%;background:var(--red);transition:width .3s}
.count{font-size:.85rem;color:var(--muted);margin-bottom:4px}

/* index card */
.card{background:var(--card);border-radius:6px;box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(0,0,0,.35);
  position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);
  background-position:0 58px;background-repeat:repeat-y;background-size:100% calc(100% - 58px)}
.card::before{content:"";position:absolute;left:0;right:0;top:56px;height:2px;background:var(--red);opacity:.85}
.card-top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:.85rem;color:var(--muted)}
.card-top .kind{color:var(--red);font-weight:700}
.card-body{padding:22px 18px 22px}
.ask{color:var(--muted);margin:0 0 6px;font-size:.92rem}
.term{font-size:clamp(1.7rem,7vw,2.4rem);font-weight:700;line-height:1.15;margin:0 0 6px;word-break:break-word}
.zh{font-size:1.25rem;margin:0 0 10px}
.zh.big{font-size:clamp(1.4rem,6vw,1.9rem);font-weight:700;line-height:1.3}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.speak{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:13px 20px;font-weight:700;cursor:pointer;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.mt{margin-top:18px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;font-size:1.05rem}
.opt.term-opt{font-family:"Fraunces",Georgia,serif;font-weight:500}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg)}
.field{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:1.15rem;font-family:"Fraunces",Georgia,serif}
.field.right{border-color:var(--ok);background:var(--ok-bg)}
.field.wrong{border-color:var(--red)}
.hint{font-family:"Fraunces",Georgia,serif;letter-spacing:.12em;font-size:1.15rem;color:var(--muted);min-height:1.6em;margin:6px 0}
.feedback{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.95rem}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg)}
.feedback .term{font-size:1.3rem;display:block;margin-top:2px}

/* forms */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-family:"Fraunces",Georgia,serif;font-size:1.35rem;margin:0 0 6px}
.panel h3{font-size:1rem;margin:20px 0 8px}
label.l{display:block;font-weight:600;margin:14px 0 6px}
.text{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--card)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.88rem;cursor:pointer;line-height:1.35}
.chk input{margin-top:3px}
.chk:has(input:checked){border-color:var(--ok);background:var(--ok-bg)}
.err{color:var(--red);font-size:.9rem;margin-top:8px}

/* done */
.done h2{font-family:"Fraunces",Georgia,serif;font-size:1.8rem;margin:0}
.score{font-size:3rem;font-family:"Fraunces",Georgia,serif;font-weight:700;line-height:1;margin:14px 0 4px}
.codebox{margin-top:14px;padding:12px;border:2px dashed var(--red);border-radius:8px;word-break:break-all;user-select:all;-webkit-user-select:all;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:var(--soft)}
.copied{color:var(--ok);font-size:.9rem;min-height:1.3em;margin-top:6px}

/* list */
details.ch{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.ch summary{padding:12px 14px;cursor:pointer;font-weight:600}
details.ch summary .muted{font-weight:400}
.wl{list-style:none;margin:0;padding:0 14px 10px}
.wl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.wl .t{font-family:"Fraunces",Georgia,serif;font-weight:500;flex:1 1 50%}
.wl .z{flex:1 1 50%;color:var(--muted);font-size:.93rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.l{background:#6A93C8}.dot.m{background:var(--ok)}
.mini{background:none;border:0;cursor:pointer;padding:4px;font-size:1rem}

/* teacher */
.tablewrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.88rem;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{color:var(--muted);font-weight:600}
td.miss{color:var(--red)}
td.hit{color:var(--ok);font-weight:700}
th.today,td.today{background:var(--soft)}
td:first-child.today{background:var(--card)}
textarea.text{min-height:110px;resize:vertical;font-size:.88rem}
.pill{display:inline-block;background:var(--bad-bg);border-radius:999px;padding:2px 10px;margin:3px 4px 0 0;font-size:.88rem}
.recs{margin:0;padding:0;list-style:none}
.rec{padding:8px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec.bad{border-left:3px solid var(--red);padding-left:10px;margin:6px 0;border-bottom:0;background:var(--bad-bg);border-radius:0 8px 8px 0}
.rec .t{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:700;font-size:1.05rem}
.rec .z{color:var(--muted);margin-left:6px}
.rec .why{margin-top:3px}
.rec .okm{color:var(--ok);font-weight:700;margin-right:6px}
.recsum{cursor:pointer;font-weight:600;margin:8px 0}
.miss-list{list-style:none;padding:0;margin:0}
.miss-list li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
.miss-list .n{color:var(--red);font-weight:700;min-width:2.5em}
.warn{background:var(--bad-bg);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:.92rem}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.seg button:disabled{opacity:.4;cursor:default}
.flip{display:block;width:100%;border:0;padding:0;background:none;perspective:1200px;cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative;min-height:270px}
.flip .face{position:absolute;inset:0;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s ease}
.flip .back{transform:rotateY(180deg)}
.flip.is-flipped .front{transform:rotateY(-180deg)}
.flip.is-flipped .back{transform:rotateY(0)}
.flip .card-body{display:flex;flex-direction:column;gap:6px;flex:1}
.flip .term{display:block}
.flip .zh{display:block}
.flip .tap{margin-top:auto}
.flip .small-term{font-size:1.15rem;color:var(--muted);font-weight:500}
.en{display:block;color:var(--muted);font-style:italic;font-size:.95rem;margin:2px 0 10px}
.wl .en{margin:2px 0 0}
.flip .en{margin:0}
.seen-mark{color:var(--ok);font-weight:700}
/* motivation */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px}
.cal .h{font-size:.78rem;color:var(--muted);text-align:center}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.88rem}
.cal .d.on{background:var(--ok);color:var(--card);font-weight:700}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--red)}
.cal .d.future{color:var(--line)}
.bigstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.bigstat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.bigstat b{display:block;font-family:"Fraunces",Georgia,serif;font-size:1.9rem;line-height:1.1}
.bigstat span{font-size:.85rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;background:var(--card)}
.badge .ic{font-size:1.8rem;line-height:1.2}
.badge .bn{display:block;font-weight:700;font-size:.86rem}
.badge .bd{display:block;font-size:.74rem;color:var(--muted)}
.badge.off{opacity:.45;filter:grayscale(1)}
.chbar{margin:10px 0}
.chbar .lab{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.chbar .lab .done{color:var(--ok);font-weight:700}
.bar{height:9px;background:var(--line);border-radius:5px;position:relative;overflow:hidden;margin-top:4px}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.bar .l{background:#6A93C8}.bar .m{background:var(--ok)}
.legend{font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.combo{display:inline-block;color:var(--red);font-weight:700;margin-left:10px}
.combo.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
.newbadge{background:var(--ok-bg);border:1.5px solid var(--ok);border-radius:12px;padding:12px 14px;margin-bottom:14px;animation:pop .5s}
.newbadge .ic{font-size:1.6rem;margin-right:6px}
.confetti{position:fixed;top:0;width:8px;height:14px;z-index:50;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(105vh) rotate(720deg)}}
.lb-img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:12px;display:block}
.trend{font-weight:700}.trend.up{color:var(--ok)}.trend.down{color:var(--red)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <div class="brand">
      <h1>Kosa Kata Sejarah</h1>
      <p>Sejarah Tingkatan 1–5 每日生字</p>
    </div>
    <nav class="tabs" aria-label="页面">
      <a href="#latihan" data-v="latihan">今日练习</a>

      <a href="#senarai" data-v="senarai">词表</a>
      <a href="#guru" data-v="guru">老师</a>
    </nav>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>

/* ---------- storage ---------- */
const LS_KEY='sjvocab:v2', T_KEY='sjvocab:teacher:v2';
let storageOk=true;
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){storageOk=false;return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){storageOk=false}}

/* ---------- dates ---------- */
function todayStr(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
function dayNum(s){return Math.round(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8))/864e5)}
function strFromDay(n){const d=new Date(n*864e5);return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')}
function prettyDate(s){return `${+s.slice(4,6)}/${+s.slice(6,8)}`}
const WEEK=['日','一','二','三','四','五','六'];
function weekday(s){return WEEK[new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8))).getUTCDay()]}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\s*-\s*/g,'-').replace(/\s*,\s*/g,', ').replace(/\s+/g,' ').trim()}
const INT=[0,1,2,4,7,15,30];

/* ---------- speech ---------- */
let voice=null;
const canSpeak='speechSynthesis' in window;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^ms/i.test(v.lang))||vs.find(v=>/^id/i.test(v.lang))||null}catch(e){}}
if(canSpeak){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
function speak(t){if(!canSpeak)return;try{const u=new SpeechSynthesisUtterance(String(t).replace(/\s*=\s*/g,', '));if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='ms-MY';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const speakBtn=t=>canSpeak?`<button class="speak" data-say="${esc(t)}" aria-label="朗读">🔊 听</button>`:'';

/* ---------- completion codes ---------- */
const SALT='infinity-sejarah-2026';
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(36).padStart(7,'0').slice(-6)}
function b64e(str){const b=new TextEncoder().encode(str);let bin='';b.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)}
function makeCode(r){const p=b64e(JSON.stringify([S.name,S.cls||'',S.form,r.date,r.c,r.t,r.n,S.streak,r.learned,r.miss.map(x=>x.toString(36)).join('.')]));return `SJ2-${p}.${fnv(p+SALT)}`}
function readCode(code){const m=code.match(/^SJ2-([A-Za-z0-9_-]+)\.([0-9a-z]{6})$/);if(!m)return null;if(fnv(m[1]+SALT)!==m[2])return {bad:true};
  try{const a=JSON.parse(b64d(m[1]));if(!Array.isArray(a)||a.length<10)return {bad:true};
  return {name:String(a[0]),cls:String(a[1]),form:+a[2],date:String(a[3]),c:+a[4],t:+a[5],n:+a[6],st:+a[7],l:+a[8],miss:a[9]?String(a[9]).split('.').map(x=>parseInt(x,36)).filter(x=>WORDS[x]):[]}}catch(e){return {bad:true}}}

/* ---------- session ---------- */
function buildSession(){
  const date=todayStr(), td=dayNum(date);
  const due=Object.entries(S.words).filter(([id,w])=>WORDS[id]&&w.d<=td).sort((a,b)=>a[1].d-b[1].d).slice(0,20).map(([id])=>+id);
  const newIds=[];
  for(const k of learnOrder(S.form)){ if(!S.chapters.includes(k))continue;
    for(const id of CH[k].ids){ if(newIds.length>=S.newPerDay)break; if(!S.words[id])newIds.push(id)} }
  const quiz=[];
  newIds.forEach(id=>{quiz.push({k:'zh',id});quiz.push({k:'spell',id})});
  due.forEach(id=>quiz.push({k:Math.random()<.6?'spell':'term',id}));
  const quizS=spread(quiz);
  S.session={date,tasks:[...(newIds.length?[{k:'cards',ids:newIds,ci:0,seen:[]}]:[]),...quizS],i:0,newIds,reviewIds:due,wrong:[],done:false};
  saveS();
}
function finishSession(){
  const s=S.session, td=dayNum(s.date), all=[...s.newIds,...s.reviewIds];
  all.forEach(id=>{const w=S.words[id]||{b:0};w.b=s.wrong.includes(id)?1:Math.min(w.b+1,6);w.d=td+INT[w.b];S.words[id]=w});
  if(S.lastDone!==s.date){S.streak=(S.lastDone===strFromDay(td-1))?(S.streak||0)+1:1;S.lastDone=s.date}
  const c=all.filter(id=>!s.wrong.includes(id)).length;
  const r={date:s.date,c,t:all.length,n:s.newIds.length,learned:Object.keys(S.words).length,miss:s.wrong.slice(0,10)};
  S.history=S.history||{};S.history[s.date]={...(S.history[s.date]||{}),c,t:all.length,n:s.newIds.length};
  S.best=Math.max(S.best||0,S.streak||0);
  s.done=true;s.result=r;s.code=makeCode(r);checkBadges();saveS();
}

function renderTask(){

function logRes(id,f,val,txt){if(PR||!S.session)return;const L=S.session.log=S.session.log||{};const e=L[id]=L[id]||{};

  saveS()}
function markWrong(id){if(PR){if(!PR.wrong.includes(id))PR.wrong.push(id);return}const s=S.session;if(!s.wrong.includes(id)){s.wrong.push(id);saveS()}}

function spread(list,gap=3){const rest=shuffle([...list]),out=[];

    const okSpell=t=>t.k!=='spell'||!rest.some(r=>r.id===t.id&&r.k!=='spell');
    let pool=rest.filter(t=>!recent.includes(t.id)&&okSpell(t));
    if(!pool.length)pool=rest.filter(t=>t.id!==(out[out.length-1]||{}).id&&okSpell(t));
    if(!pool.length)pool=rest.filter(okSpell);
    if(!pool.length)pool=rest;

          <td>${last.st}</td><td>${last.l}</td><td><button class="mini" data-rm="${esc(k)}" aria-label="移除 ${esc(s.name)}">${armed===k?'确认移除':'×'}</button></td></tr>`}).join('')}
    </tbody></table></div><p class="small muted">格子里是当天一次答对的比例；“—”表示那天没交码。</p>`
    :`<p class="muted mt">${recs.length?'这个年级还没有记录。':'还没有任何记录。学生做完每日练习后会拿到完成码，把码贴到上面就会出现在这里。'}</p>`}
  </section>

  ${list.length?`<section class="panel mt"><h2>本周排行榜</h2>
    <p class="small muted">按 ${prettyDate(days[0])}–${prettyDate(days[6])} 这 7 天的交码天数排名，天数一样再比连续天数和准确率。${tForm?`目前只算 T${tForm}。`:'可以用上面的年级筛选，分开做各年级的排行榜。'}</p>
    <div class="row mt"><button class="btn" id="lbimg">生成排行榜图片</button><button class="btn ghost" id="lbtxt">复制文字版</button></div>
    <div class="copied" id="lbmsg" aria-live="polite"></div><div id="lbout"></div></section>`:''}

  ${top.length?`<section class="panel mt"><h2>这一周最多人答错的词</h2><p class="small muted">适合上课时快速再讲一次。</p><ul class="miss-list">
    ${top.map(([id,n])=>`<li><span class="n">${n} 次</span><span class="serif" style="font-weight:700">${esc(WORDS[id].t)}</span><span class="muted">${esc(WORDS[id].z)}</span><span class="muted small">${CH[WORDS[id].ch].label}</span></li>`).join('')}</ul></section>`:''}

  <section class="panel mt"><h2>怎么用</h2>
    <p class="small">把这个页面的链接发给学生。学生第一次打开时填名字，先选年级，再选要学的章节。之后每天打开就有当天的练习：新词先看一遍，再做选择题和听写，答错的词会在同一轮重新出现，隔天也会再考。做完就拿到完成码。</p>
    <p class="small">学生的进度存在他自己的手机里，所以要提醒他们每天用同一部手机、同一个浏览器打开，不要用无痕模式。</p>
    <div class="row mt"><button class="btn ghost" id="lk">锁上老师页</button><button class="btn ghost" id="clr">${armed==='__all'?'再按一次，清除全部记录':'清除全部记录'}</button></div>
  </section>`;

  $('#rd').onclick=()=>{
    const txt=$('#pa').value, found=txt.match(/SJ2-[A-Za-z0-9_-]+\.[0-9a-z]{6}/g)||[];
    let add=0,dup=0,bad=0;
    found.forEach(c=>{const r=readCode(c);if(!r||r.bad){bad++;return}const key=sKey(r)+'|'+r.date;if(T.recs[key])dup++;else{T.recs[key]={...r,at:Date.now()};add++}});
    saveT();armed=null;renderTeacher();
    $('#rs').textContent=found.length?`新增 ${add} 个${dup?`，重复 ${dup} 个`:''}${bad?`，${bad} 个无效（可能被改过）`:''}。`:'没有找到完成码。';
  };
  app.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{tForm=+b.dataset.tf;armed=null;renderTeacher()});
  const ranking=()=>{const rows=list.map(([k,s])=>{const rs=days.map(d=>s.by[d]).filter(Boolean);const acc=rs.filter(r=>r.t).map(r=>r.c/r.t);
      return {name:s.name,form:s.form,days:rs.length,streak:(s.by[s.last]||{}).st||0,acc:acc.length?acc.reduce((a,b)=>a+b,0)/acc.length:0}}).filter(r=>r.days>0)
      .sort((a,b)=>b.days-a.days||b.streak-a.streak||b.acc-a.acc);
    let rank=0,prev=null;rows.forEach((r,i)=>{const key=r.days+'|'+r.streak+'|'+r.acc.toFixed(3);if(key!==prev){rank=i+1;prev=key}r.rank=rank});return rows};
  const title=`Sejarah 每日生字 本周排行榜${tForm?`（T${tForm}）`:''}`, range=`${prettyDate(days[0])} – ${prettyDate(days[6])}`;
  const medal=r=>r===1?'🥇':r===2?'🥈':r===3?'🥉':`${r}.`;
  if($('#lbtxt'))$('#lbtxt').onclick=async()=>{const rows=ranking();if(!rows.length){$('#lbmsg').textContent='这 7 天还没有人交码。';return}
    const full=rows.filter(r=>r.days===7).map(r=>r.name);
    const txt=`🏆 ${title}\n📅 ${range}\n\n${rows.slice(0,10).map(r=>`${medal(r.rank)} ${r.name}：${r.days}/7 天，连续 ${r.streak} 天`).join('\n')}${full.length?`\n\n👏 全勤 7 天：${full.join('、')}`:''}\n\n继续加油，每天 10 分钟！💪`;
    let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(e){}
    $('#lbout').innerHTML=`<textarea class="text mt" rows="10" readonly>${esc(txt)}</textarea>`;
    $('#lbmsg').textContent=ok?'已复制，可以直接贴到 WhatsApp 群。':'请在下面框里全选复制。'};
  if($('#lbimg'))$('#lbimg').onclick=()=>{const rows=ranking();if(!rows.length){$('#lbmsg').textContent='这 7 天还没有人交码。';return}
    const top=rows.slice(0,10), full=rows.filter(r=>r.days===7).map(r=>r.name);
    const W=1080, rowH=92, Hh=300+top.length*rowH+(full.length?150:40)+110;
    const cv=document.createElement('canvas');cv.width=W;cv.height=Hh;const g=cv.getContext('2d');
    const F=(w,s)=>`${w} ${s}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif`;
    g.fillStyle='#1E3A32';g.fillRect(0,0,W,Hh);
    g.fillStyle='#F1F5F0';g.font=F('bold',58);g.fillText('🏆 本周之星',70,120);
    g.font=F('normal',34);g.fillStyle='#A9BDB4';g.fillText(`Sejarah 每日生字${tForm?`  T${tForm}`:''}   ${range}`,70,180);
    let yy=240;
    top.forEach((r,i)=>{g.fillStyle=i<3?'#FFFFFF':'#E8EEEA';g.beginPath();if(g.roundRect)g.roundRect(60,yy,W-120,rowH-14,16);else g.rect(60,yy,W-120,rowH-14);g.fill();
      g.fillStyle='#C23B3B';g.fillRect(60,yy,8,rowH-14);
      g.fillStyle='#1A1F1D';g.font=F('bold',r.rank<=3?44:36);g.fillText(medal(r.rank),95,yy+56);
      g.font=F('bold',38);g.fillText(r.name.length>14?r.name.slice(0,13)+'…':r.name,200,yy+55);
      g.font=F('normal',30);g.fillStyle='#2E7D4F';g.textAlign='right';g.fillText(`${r.days}/7 天   连续 ${r.streak} 天`,W-90,yy+53);g.textAlign='left';
      yy+=rowH});
    if(full.length){yy+=30;g.fillStyle='#F1F5F0';g.font=F('bold',36);g.fillText('👏 全勤 7 天',70,yy+10);
      g.font=F('normal',30);g.fillStyle='#D8E4DD';let line='',ly=yy+60;full.forEach(n=>{const t=(line?line+'、':'')+n;if(g.measureText(t).width>W-140){g.fillText(line,70,ly);line=n;ly+=44}else line=t});if(line)g.fillText(line,70,ly);yy=ly}
    g.fillStyle='#A9BDB4';g.font=F('normal',30);g.fillText('每天 10 分钟，继续加油！',70,Hh-60);
    let url='';try{url=cv.toDataURL('image/png')}catch(e){}
    if(!url){$('#lbmsg').textContent='这个浏览器无法生成图片，请改用文字版。';return}
    $('#lbout').innerHTML=`<img class="lb-img" id="lbpic" src="${url}" alt="本周排行榜图片">`;
    $('#lbmsg').textContent='手机：长按图片可以保存或分享；电脑：右键图片选“复制图片”，再贴到 WhatsApp。'};
  $('#pv').onclick=()=>{tEnd=strFromDay(dayNum(tEnd)-7);armed=null;renderTeacher()};
  $('#nv').onclick=()=>{tEnd=strFromDay(Math.min(dayNum(tEnd)+7,dayNum(todayStr())));armed=null;renderTeacher()};
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const k=b.dataset.rm;
    if(armed!==k){armed=k;renderTeacher();return}
    Object.keys(T.recs).forEach(rk=>{if(sKey(T.recs[rk])===k)delete T.recs[rk]});armed=null;saveT();renderTeacher()});
  $('#lk').onclick=()=>{unlocked=false;try{localStorage.removeItem(GURU_KEY)}catch(e){}renderTeacher()};
  $('#clr').onclick=()=>{if(armed!=='__all'){armed='__all';renderTeacher();return}T={recs:{}};saveT();armed=null;renderTeacher()};
}

route();

</script>
</body>
</html>
